<div>
  <h2 id="page-heading" data-cy="EquipoHeading">
    <span jhiTranslate="oncallApp.equipo.home.title">Equipos</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info me-2" (click)="load()" [disabled]="isLoading()">
        <fa-icon icon="sync" [animation]="isLoading() ? 'spin' : undefined" />
        <span jhiTranslate="oncallApp.equipo.home.refreshListLabel">Refrescar lista</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-equipo"
        [routerLink]="['/equipo/new']"
      >
        <fa-icon icon="plus" />
        <span jhiTranslate="oncallApp.equipo.home.createLabel">Crear nuevo Equipo</span>
      </button>
    </div>
  </h2>

  <jhi-alert-error />

  <jhi-alert />

  @if (equipos().length === 0) {
    <div class="alert alert-warning" id="no-result">
      <span jhiTranslate="oncallApp.equipo.home.notFound">Ningún Equipos encontrado</span>
    </div>
  } @else {
    <div class="table-responsive table-entities" id="entities">
      <table class="table table-striped" aria-describedby="page-heading">
        <thead>
          <tr jhiSort [(sortState)]="sortState" (sortChange)="navigateToWithComponentValues($event)">
            <th scope="col" jhiSortBy="id">
              <div class="d-flex">
                <span jhiTranslate="global.field.id">ID</span>

                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col" jhiSortBy="nombre">
              <div class="d-flex">
                <span jhiTranslate="oncallApp.equipo.nombre">Nombre</span>

                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col" jhiSortBy="emailContacto">
              <div class="d-flex">
                <span jhiTranslate="oncallApp.equipo.emailContacto">Email Contacto</span>

                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col" jhiSortBy="canalChat">
              <div class="d-flex">
                <span jhiTranslate="oncallApp.equipo.canalChat">Canal Chat</span>

                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          @for (equipo of equipos(); track trackId(equipo)) {
            <tr data-cy="entityTable">
              <td>
                <a [routerLink]="['/equipo', equipo.id, 'view']">{{ equipo.id }}</a>
              </td>
              <td>{{ equipo.nombre }}</td>
              <td>{{ equipo.emailContacto }}</td>
              <td>{{ equipo.canalChat }}</td>
              <td class="text-end">
                <div class="btn-group">
                  <a [routerLink]="['/equipo', equipo.id, 'view']" class="btn btn-info btn-sm" data-cy="entityDetailsButton">
                    <fa-icon icon="eye" />
                    <span class="d-none d-md-inline" jhiTranslate="entity.action.view">Vista</span>
                  </a>

                  <a [routerLink]="['/equipo', equipo.id, 'edit']" class="btn btn-primary btn-sm" data-cy="entityEditButton">
                    <fa-icon icon="pencil-alt" />
                    <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Editar</span>
                  </a>

                  <button type="submit" (click)="delete(equipo)" class="btn btn-danger btn-sm" data-cy="entityDeleteButton">
                    <fa-icon icon="times" />
                    <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Eliminar</span>
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
